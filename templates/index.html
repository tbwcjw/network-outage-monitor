<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network Outage Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>

<body>
    <div class="container py-4">
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <h1 class="h3 mb-0">Network Outage Monitor</h1>

                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <a href='#heatmap' class="btn btn-primary btn-sm">Go to Heatmap</a>

                    <a href="/api/status" download="netstatus.json" class="btn btn-secondary btn-sm">Download JSON</a>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-1">
                <div class="small text-muted">
                    <p class="mb-1">Last update: {{last_update}}</p>
                    <p class="mb-0">Update interval: {{update_ival}}s</p>
                </div>
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" id="hideUp">
                    <label class="form-check-label">Hide "up" events</label>
                </div>
            </div>

        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex justify-content-between align-items-center">
                <button class="btn btn-sm btn-outline-primary" id="prevPage">
                    Previous Day
                </button>

                <span id="pageLabel" class="small text-muted"></span>

                <button class="btn btn-sm btn-outline-primary" id="nextPage">
                    Next Day
                </button>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="statusTable">
                    <thead class="table-light">
                        <tr>
                            <th class="sortable">Timestamp</th>
                            <th class="sortable">Overall</th>
                            {% for host in hosts %}
                            <th class="sortable">{{ host }}</th>
                            {% endfor %}
                            <th class="sortable d-none d-md-table-cell">Note</th>
                        </tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </div>
        <div class="card shadow-sm mb-4 mt-2">
            <div class="card-body d-flex justify-content-between align-items-center">
                <button class="btn btn-sm btn-outline-primary" id="prevPageBottom">
                    Previous Day
                </button>

                <span id="pageLabelBottom" class="small text-muted"></span>

                <button class="btn btn-sm btn-outline-primary" id="nextPageBottom">
                    Next Day
                </button>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">Heatmap</h2>
                <div id="heatmap"></div>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <span class="small text-muted">Past</span>
                <span class="small text-muted">Current</span>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>const hosts = {{ hosts | tojson }};</script>
    <script src="/static/script.js"></script>
</body>

</html>
